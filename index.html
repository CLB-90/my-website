<!DOCTYPE html>
<html>
<head>
    <title>My Store</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Navbar -->
<div class="navbar">
    <h2>My Store</h2>
    <input type="text" placeholder="Search products...">
</div>

<!-- Products -->
<div class="products">

    <div class="card">
        <img src="https://via.placeholder.com/150">
        <h3>Shirt</h3>
        <p>Rs 500</p>
        <button>Buy Now</button>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/150">
        <h3>Shoes</h3>
        <p>Rs 1200</p>
        <button>Buy Now</button>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/150">
        <h3>Watch</h3>
        <p>Rs 2000</p>
        <button>Buy Now</button>
    </div>

</div>

</body>
</html>
